packages:
  - "apps/*"
  - "packages/*"

# Postinstall scripts permitidos (native builds).
# sharp: image optimization do Next.js
# unrs-resolver: resolver nativo usado por eslint/etc.
# esbuild: usado por tsx/tsup/vitest
# prisma / @prisma/*: geração do client e engines
allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true

# Overrides — força versão única de @types/react em toda a árvore para evitar
# conflito ReactNode entre @testing-library/react (traz 18.3) e Next 15/React 19.
overrides:
  "@types/react": "^19.0.0"
  "@types/react-dom": "^19.0.0"
